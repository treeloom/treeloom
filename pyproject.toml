[project]
name = "treeloom"
version = "2026.9.22"
description = "Treeloom - GraphRAG code search with tree-sitter indexing"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Rodger Brennan" }]
keywords = ["rag", "graphrag", "code-search", "tree-sitter", "mcp", "milvus", "neo4j"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Text Processing :: Indexing",
]
requires-python = ">=3.11"
dependencies = [
    "structlog>=24.0.0",
    "tree-sitter>=0.24",
    "chonkie[code]>=1.3.0",
    "pymilvus>=2.4",
    "httpx>=0.27",
    "mcp>=1.27,<2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.32",
    "gitpython>=3.1",
    "neo4j>=5.25",
    "networkx>=3.3",
    "python-louvain>=0.16",
    "asyncpg>=0.30",
    "bcrypt>=4.0",
    "tokenizers>=0.20",
    "huggingface_hub>=0.24",
    "prometheus_client>=0.20",
    "tiktoken>=0.7",
    "pyyaml>=6.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "opentelemetry-instrumentation-logging>=0.48b0",
]

[project.optional-dependencies]
# Test/dev tooling only (pytest + plugins). tests/unit also imports every
# optional-backend package (aiosqlite, chromadb, lancedb, fastembed) via adapter/factory tests, so `dev` alone is NOT
# sufficient to run the full suite. The canonical install for running
# tests/unit end to end (also used by CI, CONTRIBUTING.md, and README's
# Testing section) combines this with the existing `all-backends`
# (chromadb/lancedb) and `simple`
# (lancedb/fastembed/aiosqlite) extras rather than duplicating their
# package lists here:
#   pip install -e ".[dev,all-backends,simple]"
dev = ["pytest>=8", "pytest-asyncio>=1.0", "pytest-mock>=3.12"]
# Alternate vector backends. Milvus (the default) is in the base install.
# Install with: pip install -e .[chromadb]   /   .[lancedb]
# or .[all-backends] for every supported store.
chromadb = ["chromadb>=0.5"]
lancedb = ["lancedb>=0.33"]
# The simple deployment profile (TREELOOM_PROFILE=simple, docs/simple-mode.md):
# embedded LanceDB vectors + SQLite graph + in-process CPU reranker.
simple = [
    "lancedb>=0.33",
    "fastembed>=0.7",
    "aiosqlite>=0.20",
]
# Self-hosted sentence-transformers reranker (RERANKER_PROVIDER=local-st):
# HF cross-encoders fastembed can't load, e.g. zeroentropy/zerank-*.
# Pulls torch — heavy; needs a numpy<2 / transformers-compatible env.
local-st = ["sentence-transformers>=3.0"]
# Opt-in Opik experiment tracking for the agentic benchmark. Only
# the benchmark harness imports it, lazily, when OPIK_TRACK/OPIK_URL is set.
opik = ["opik>=2.0"]
all-backends = [
    "chromadb>=0.5",
    "lancedb>=0.33",
]

[project.urls]
Repository = "https://github.com/treeloom/treeloom"

[project.scripts]
# stdio MCP server. Point an MCP client at this command; see README.
treeloom-mcp = "treeloom.application.mcp_stdio:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "domain: Pure domain logic, no I/O dependencies",
    "adapter: Tests that mock out-of-process dependencies (TEI, Milvus, Neo4j)",
    "slow: Tests that call docker services (integration)",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-asyncio>=0.23",
]
