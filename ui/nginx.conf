server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA client-side routing: unknown paths fall back to the app shell so a
    # hard refresh on e.g. /jobs/abc still loads the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config + HTML shell must never be cached, so a redeploy or an
    # API-base change is picked up immediately.
    location = /config.js {
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Vite emits content-hashed asset filenames — safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
