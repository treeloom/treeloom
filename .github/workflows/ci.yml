name: CI

# Document-only and image-only changes never touch the code the unit suite
# exercises, so they skip this workflow entirely. GitHub applies
# `paths-ignore` only when EVERY changed file matches, so a PR that mixes a
# doc edit with a code change still runs. (If `unit-tests` ever becomes a
# required status check, a skipped run leaves the check unreported and the
# PR unmergeable — at that point add a stand-in job on the inverse filter
# that reports the same check name instead of relying on this skip.)
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "**/*.svg"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.webp"
      - "**/*.ico"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.svg"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.webp"
      - "**/*.ico"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        # dev alone is test-tooling only; tests/unit also imports every
        # optional-backend package (aiosqlite/chromadb/lancedb/fastembed)
        # via adapter/factory tests, so the
        # full suite needs the all-backends + simple extras too.
        run: pip install -e ".[dev,all-backends,simple]"
      - name: Provide the quickstart env
        # The indexer fails loud at import when its service vars are unset,
        # and the unit suite imports it (services are mocked, never
        # contacted). src/treeloom/__init__.py loads the repo-root .env, so
        # the quickstart example doubles as the CI config — which also
        # keeps .env.example loadable.
        run: cp .env.example .env
      - name: Unit tests
        run: pytest tests/unit -q
