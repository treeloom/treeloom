name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        # dev alone is test-tooling only; tests/unit also imports every
        # optional-backend package (aiosqlite/chromadb/lancedb/fastembed)
        # via adapter/factory tests, so the
        # full suite needs the all-backends + simple extras too.
        run: pip install -e ".[dev,all-backends,simple]"
      - name: Unit tests
        run: pytest tests/unit -q
