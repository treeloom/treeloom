name: Docker images

# Builds the Treeloom container images and publishes them to Docker Hub.
#
#   * push of a `vX.Y.Z` tag  -> build + push `X.Y.Z`, `X.Y`, `latest`
#   * manual run              -> build + push `edge` + `sha-<short>` (any ref)
#   * pull request touching a Dockerfile / this workflow -> build only, no push
#
# Repository settings required for the push paths:
#   secrets.DOCKERHUB_USERNAME  Docker Hub account (or org member) login
#   secrets.DOCKERHUB_TOKEN     Docker Hub access token with Read & Write
#   vars.DOCKERHUB_NAMESPACE    (optional) image namespace; defaults to `treeloom`
#
# See docs/docker-images.md for the release procedure.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.indexer"
      - ".dockerignore"
      - "ui/Dockerfile"
      - "services/qwen3_reranker/**"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

env:
  IMAGE_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || 'treeloom' }}

jobs:
  build:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: indexer
            context: .
            dockerfile: Dockerfile.indexer
            platforms: linux/amd64
          - image: mcp-server
            context: .
            dockerfile: Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: ui
            context: ./ui
            dockerfile: ui/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: qwen3-reranker
            context: ./services/qwen3_reranker
            dockerfile: services/qwen3_reranker/Dockerfile
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4

      # The runner's ~14 GB free disk is not enough for the CUDA reranker
      # image (~6 GB base + layers) alongside the preinstalled toolchains.
      - name: Free runner disk space
        if: matrix.image == 'qwen3-reranker' || matrix.image == 'indexer'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Set up QEMU
        if: contains(matrix.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=treeloom-${{ matrix.image }}
            org.opencontainers.image.vendor=Treeloom

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
