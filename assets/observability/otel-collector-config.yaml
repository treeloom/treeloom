# OpenTelemetry Collector config for the LOCAL Treeloom stack only.
#
# Tail sampling is intentionally NOT configured here — it lives in the
# a central collector (see docs/observability-runbook.md).
# Local dev runs always_on head sampling and keeps every trace so the
# Grafana dashboard panels populate without waiting for a sampling
# window or chasing why a span "should" be there.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
  telemetry:
    logs:
      level: info
