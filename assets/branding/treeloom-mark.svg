  <line x1="26" y1="30" x2="26" y2="63" stroke="#39d353" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="32" y1="34" x2="35" y2="62" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
  <!-- Canopy: three weft arcs, top to bottom -->
