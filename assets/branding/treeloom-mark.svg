  <path d="M8 28 Q18 18 26 14 Q34 18 44 28" stroke="#3fb950" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <path d="M3 36 Q14 24 26 20 Q38 24 49 36" stroke="#2ea043" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Amber cross-nodes at warp/weft intersections -->
  <circle cx="26" cy="8" r="1.8" fill="#d29922"/>
  <circle cx="26" cy="14" r="2" fill="#d29922"/>
  <circle cx="26" cy="20" r="2" fill="#d29922"/>
