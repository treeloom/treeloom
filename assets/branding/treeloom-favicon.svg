<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Treeloom Favicon — Thread-Tree Mark optimized for 16/32px -->
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0d1117"/>
  <!-- Trunk -->
  <line x1="13" y1="20" x2="12" y2="29" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="18" x2="16" y2="30" stroke="#39d353" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="19" y1="20" x2="20" y2="29" stroke="#3fb950" stroke-width="2" stroke-linecap="round"/>
  <!-- Canopy arcs -->
  <path d="M10 12 Q14 8 16 6 Q18 8 22 12" stroke="#39d353" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M7 16 Q12 11 16 9 Q20 11 25 16" stroke="#3fb950" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M4 20 Q10 14 16 12 Q22 14 28 20" stroke="#2ea043" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Amber nodes -->
  <circle cx="16" cy="6" r="1.2" fill="#d29922"/>
  <circle cx="16" cy="9" r="1.3" fill="#d29922"/>
  <circle cx="16" cy="12" r="1.3" fill="#d29922"/>
</svg>
