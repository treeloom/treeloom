# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# Build documentation in the "docs/" directory with Sphinx (Markdown via MyST)
sphinx:
  configuration: docs/conf.py

# Python requirements needed to build the documentation (Sphinx, MyST, theme).
# Kept separate from the package's own dependencies so the docs build never
# installs Milvus/Neo4j/TEI clients.
# See https://docs.readthedocs.io/en/stable/guides/reproducible-builds.html
python:
  install:
    - requirements: docs/requirements.txt
